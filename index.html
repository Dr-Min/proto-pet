<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%23efd9b8'/%3E%3Ccircle cx='24' cy='30' r='3' fill='%234a3a2c'/%3E%3Ccircle cx='40' cy='30' r='3' fill='%234a3a2c'/%3E%3C/svg%3E">
<title>하찮은 펫 프로토타입</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4efe4; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  #hint {
    position: fixed; top: 14px; left: 16px;
    font: 13px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif;
    color: #9a8f7d; user-select: none; pointer-events: none;
  }
  #ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center; gap: 16px;
    font: 12px -apple-system, "Apple SD Gothic Neo", sans-serif; color: #8a7f6c;
    user-select: none;
  }
  .g { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .bar { width: 84px; height: 10px; background: rgba(150,135,110,.25); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 50%; background: #a8c686; border-radius: 5px; }
  #feedBtn {
    min-height: 44px; padding: 10px 20px; border: none; border-radius: 22px;
    background: #e8b87f; color: #5a4632;
    font: 600 14px -apple-system, "Apple SD Gothic Neo", sans-serif;
    cursor: pointer; touch-action: manipulation;
  }
  #feedBtn:active { transform: scale(0.96); }
</style>
</head>
<body>
<div id="hint">탭: 놀래키기 · 문지르기: 쓰다듬기 · 길게/쭉 끌기: 잡기</div>
<canvas id="c"></canvas>
<div id="ui">
  <div class="g">밥<div class="bar"><i id="gH"></i></div></div>
  <div class="g">기운<div class="bar"><i id="gE"></i></div></div>
  <button id="feedBtn">밥주기</button>
</div>
<script>
'use strict';
// allow: SIZE_OK — temporary single-file static prototype until input physics is stable; next wave should split input, simulation, and rendering.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { resize(); applySize(); });
resize();

// 마우스와 터치를 포인터 이벤트 하나로 처리 (모바일 대응)
const mouse = { x: -999, y: -999, px: -999, py: -999, moveAmt: 0 };
window.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

const input = {
  active: false,
  pointerId: null,
  pointerType: '',
  mode: 'idle',
  startX: 0, startY: 0,
  x: -999, y: -999,
  px: -999, py: -999,
  downAt: 0,
  lastMoveAt: 0,
  dragOffsetX: 0, dragOffsetY: 0,
  dragTalkT: 0,
  releaseVX: 0, releaseVY: 0,
  tapCooldown: 0,
};

const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

// ---------- 펫 상태 ----------
const pet = {
  x: 0, y: 0,          // 지면 위치 (y가 클수록 앞/아래)
  vx: 0, vy: 0,
  dir: 1,              // 바라보는 방향
  r: 46,               // 몸통 기본 반지름
  squash: 1, squashVel: 0,   // 말랑 스프링 (세로 스케일)
  jy: 0, jvy: 0,       // 점프 오프셋
  walkPhase: 0,
  wobblePhase: 0,
  gazeX: 0, gazeY: 0,  // 시선 (-1..1)
  blink: 0, nextBlink: 1,
  earTwitch: { side: 0, t: 9 }, nextTwitch: 3,   // 가끔 귀 움찔
  happy: 0, dizzy: 0,
  tripT: 0,
  behavior: 'stare', behaviorT: 2,
  munchT: 0,
  target: { x: 0, y: 0 },
  caption: '…',
  captionT: 0,
  landCaption: '',
  landingT: 0,
  zTimer: 0,
  lumps: [],           // 몸통 비대칭 울퉁불퉁 (개체 고유)
};
pet.x = W / 2; pet.y = H * 0.62;
pet.target.x = pet.x; pet.target.y = pet.y;
for (let i = 0; i < 14; i++) pet.lumps.push(rand(-2.2, 2.2));

// PC에서 보이는 현재 비율을 기준으로 모바일에서도 같은 체감 크기를 유지한다.
function applySize() { pet.r = 46; }
applySize();

function depthScale() { return 0.75 + (pet.y / H) * 0.45; }
function topBounceLimit() { return Math.max(78, H * 0.1); }
function outlineWidth(r) { return clamp(r * 0.043, 1.8, 2.15); }

// ---------- 욕구 ----------
const needs = { hunger: 0.85, energy: 0.9 }; // 1 = 든든/쌩쌩, 0 = 배고픔/탈진
let food = null;                             // {x, y} 밥그릇
const SAVE_KEY = 'protopet-care-v1';

function saveCareState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      hunger: needs.hunger,
      energy: needs.energy,
      ts: Date.now(),
    }));
  } catch (_) {}
}

function loadCareState() {
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!saved) return;
    const away = clamp((Date.now() - saved.ts) / 1000, 0, 12 * 3600);
    const savedHunger = Number(saved.hunger);
    const savedEnergy = Number(saved.energy);
    needs.hunger = clamp((Number.isFinite(savedHunger) ? savedHunger : needs.hunger) - away * 0.00012, 0, 1);
    needs.energy = clamp((Number.isFinite(savedEnergy) ? savedEnergy : needs.energy) + away * 0.0002, 0, 1);
    if (away > 60) {
      pet.caption = '기다렸어…';
      pet.captionT = 0;
    }
  } catch (_) {}
}
loadCareState();
setInterval(saveCareState, 5000);
window.addEventListener('pagehide', saveCareState);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveCareState(); });

// ---------- 발: 절차적 걸음 ----------
// 발은 땅에 붙어 있다가, 몸이 지나가서 너무 멀어지면 앞쪽으로 폴짝 옮겨 딛는다
const feet = [-0.62, -0.22, 0.22, 0.62].map((ox, i) => ({
  ox, x: pet.x + ox * pet.r, y: pet.y,
  fromX: 0, fromY: 0, toX: 0, toY: 0,
  lift: -1,            // 0..1 진행중, -1이면 착지 상태
  group: i % 2,        // 대각선 발끼리 같이 움직임
}));
let stepClock = 0;

function footBodyTarget(f) {
  const s = depthScale(), r = pet.r * s;
  return {
    x: pet.x + f.ox * r * 0.9,
    y: pet.y + pet.jy + r * 0.34 + Math.abs(f.ox) * 3 * s,
  };
}

function reanchorFeetToBody(strength) {
  for (const f of feet) {
    const target = footBodyTarget(f);
    f.lift = -1;
    f.x = lerp(f.x, target.x, strength);
    f.y = lerp(f.y, target.y, strength);
    f.fromX = f.x; f.fromY = f.y;
    f.toX = f.x; f.toY = f.y;
  }
}

function updateHeldFeet(dt) {
  const s = depthScale();
  for (let i = 0; i < feet.length; i++) {
    const f = feet[i];
    const target = footBodyTarget(f);
    const pair = i % 2;
    const phase = pet.wobblePhase * 5 + pair * Math.PI;
    const side = i < 2 ? -1 : 1;
    const tuckX = side * 2.4 * s;
    const kickX = tuckX + Math.sin(phase) * (3.3 + Math.abs(f.ox) * 4.2) * s;
    const kickY = Math.cos(phase * 1.15) * 5.2 * s + pair * 1.5 * s;
    f.lift = -1;
    f.x = lerp(f.x, target.x + kickX, 1 - Math.exp(-18 * dt));
    f.y = lerp(f.y, target.y + kickY, 1 - Math.exp(-18 * dt));
    f.fromX = f.x; f.fromY = f.y;
    f.toX = f.x; f.toY = f.y;
  }
}

function updateFeet(dt) {
  const s = depthScale(), r = pet.r * s;
  const speed = Math.hypot(pet.vx, pet.vy);
  stepClock += dt;
  if (input.mode === 'drag') {
    updateHeldFeet(dt);
    return;
  }
  if (pet.jy < -5) {
    reanchorFeetToBody(1 - Math.exp(-18 * dt));
    return;
  }
  for (const f of feet) {
    const idealX = pet.x + f.ox * r;
    const idealY = pet.y + Math.abs(f.ox) * 4 * s;
    if (f.lift < 0) {
      const d = Math.hypot(idealX - f.x, idealY - f.y);
      const thresh = speed > 150 ? 10 : 16;
      const groupBusy = feet.some(o => o !== f && o.group === f.group && o.lift >= 0);
      if (d > thresh * s && !groupBusy) {
        f.lift = 0;
        f.fromX = f.x; f.fromY = f.y;
        // 진행 방향으로 조금 앞서 딛기
        f.toX = idealX + pet.vx * 0.12;
        f.toY = idealY + pet.vy * 0.12;
      }
    } else {
      f.lift += dt / (speed > 150 ? 0.09 : 0.14);
      if (f.lift >= 1) {
        f.lift = -1; f.x = f.toX; f.y = f.toY;
        // 발 디딜 때 몸이 살짝 출렁
        pet.squashVel -= 0.9;
      } else {
        f.x = lerp(f.fromX, f.toX, f.lift);
        f.y = lerp(f.fromY, f.toY, f.lift) - Math.sin(f.lift * Math.PI) * 9 * s;
      }
    }
    const anchor = footBodyTarget(f);
    if (dist(f.x, f.y, anchor.x, anchor.y) > r * 1.35) {
      f.lift = -1;
      f.x = anchor.x;
      f.y = anchor.y;
    }
  }
}

// ---------- 꼬리: 버렛 체인 물리 + 매끈한 테이퍼 렌더링 ----------
function makeChain(n, segLen) {
  const pts = [];
  for (let i = 0; i < n; i++) pts.push({ x: pet.x, y: pet.y - 40 - i * segLen, px: pet.x, py: pet.y - 40 - i * segLen });
  return { pts, segLen };
}
const tail = makeChain(4, 8);

function updateChain(ch, ax, ay, dt, gravity, windX) {
  const p0 = ch.pts[0];
  p0.px = p0.x; p0.py = p0.y; p0.x = ax; p0.y = ay;
  for (let i = 1; i < ch.pts.length; i++) {
    const p = ch.pts[i];
    const nx = p.x + (p.x - p.px) * 0.86 + windX * dt * dt;
    const ny = p.y + (p.y - p.py) * 0.86 + gravity * dt * dt;
    p.px = p.x; p.py = p.y; p.x = nx; p.y = ny;
  }
  for (let k = 0; k < 3; k++) {
    for (let i = 1; i < ch.pts.length; i++) {
      const a = ch.pts[i - 1], b = ch.pts[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1;
      const diff = (d - ch.segLen * depthScale()) / d;
      b.x -= dx * diff; b.y -= dy * diff;
    }
  }
}

// 체인을 원이 아니라 하나의 테이퍼진 살덩이로 그린다 (포도송이 금지)
function drawTail(ch, baseR) {
  const pts = ch.pts, n = pts.length, s = depthScale();
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const o = pts[Math.max(i - 1, 0)], q = pts[Math.min(i + 1, n - 1)];
    let dx = q.x - o.x, dy = q.y - o.y;
    const d = Math.hypot(dx, dy) || 1;
    const w = baseR * (1 - (i / n) * 0.75) * s;
    left.push({ x: p.x - dy / d * w, y: p.y + dx / d * w });
    right.push({ x: p.x + dy / d * w, y: p.y - dx / d * w });
  }
  const tip = pts[n - 1], prev = pts[n - 2];
  const ex = tip.x + (tip.x - prev.x) * 0.6, ey = tip.y + (tip.y - prev.y) * 0.6;
  ctx.beginPath();
  ctx.moveTo(right[0].x, right[0].y);
  for (let i = 0; i < n - 1; i++) {
    ctx.quadraticCurveTo(right[i].x, right[i].y, (right[i].x + right[i + 1].x) / 2, (right[i].y + right[i + 1].y) / 2);
  }
  ctx.quadraticCurveTo(ex, ey, (left[n - 1].x + left[n - 2].x) / 2, (left[n - 1].y + left[n - 2].y) / 2);
  for (let i = n - 2; i > 0; i--) {
    ctx.quadraticCurveTo(left[i].x, left[i].y, (left[i].x + left[i - 1].x) / 2, (left[i].y + left[i - 1].y) / 2);
  }
  ctx.lineTo(left[0].x, left[0].y);
  ctx.closePath();
  ctx.fillStyle = BODY; ctx.fill();
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
}

// ---------- 파티클 (하트, Zzz, 먼지) ----------
const particles = [];
function spawn(type, x, y) {
  particles.push({ type, x, y, vx: rand(-14, 14), vy: rand(-46, -26), life: 1.4, t: 0 });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.type === 'dust' ? 40 : -6) * dt;
    if (p.t > p.life) particles.splice(i, 1);
  }
}

// ---------- 행동 스케줄러: 가만히 있질 못함 ----------
const BEHAVIORS = {
  wander:  { w: 3.0, dur: [2.5, 5] },
  stare:   { w: 1.8, dur: [1.5, 3.5] },
  sniff:   { w: 2.0, dur: [2, 3.5] },
  plop:    { w: 1.4, dur: [2, 4] },
  zoomies: { w: 1.0, dur: [1.8, 3] },
  wiggle:  { w: 1.6, dur: [1, 2] },
  sleep:   { w: 0.6, dur: [6, 10] },
  eat:     { w: 0, dur: [60, 60] },
};
const CAPTIONS = {
  wander: ['어슬렁어슬렁', '산책 중', '어디 가는진 모름'],
  stare: ['멍…', '아무것도 안 보는 중', '생각이 없다'],
  sniff: ['킁킁', '바닥에서 뭔가 발견', '킁킁킁…'],
  plop: ['철푸덕', '움직이기 싫음', '녹는 중'],
  zoomies: ['갑자기 신남!!', '우다다다!!'],
  wiggle: ['꼬물꼬물', '춤(본인 생각)'],
  sleep: ['Zzz…', '꿈나라'],
  eat: ['밥이다!!', '우걱우걱'],
};
const PICKUP_LINES = ['어? 나?', '들렸어…', '왜 공중이야', '잠깐만', '발이 없어짐'];
const CARRY_LINES = ['어디가…', '나 이동중…', '발 안 닿아…', '공중 산책', '주인 손이다'];
const DROP_LINES = ['어어… 내려간다', '착지 준비…', '후웅', '나 내려놔짐', '바닥 온다'];
const LAND_LINES = ['착지…', '콩', '살았다', '땅이다', '다리 있음'];
const BOUNCE_LINES = ['통!', '퐁!', '앗 통통', '말랑반사', '벽이 있었네'];
function randomLine(lines) { return lines[Math.floor(Math.random() * lines.length)]; }
function affectNeed(name, delta) {
  needs[name] = clamp(needs[name] + delta, 0, 1);
}
function updateCare(dt, { airborne, speed }) {
  affectNeed('hunger', -dt * (0.00042 + speed * 0.000003));
  affectNeed('energy', pet.behavior === 'sleep' ? dt * 0.045 : -dt * (0.0014 + speed * 0.000012));
  if (!airborne && input.mode !== 'drag' && !food && pet.behavior !== 'sleep' && needs.energy < 0.1) {
    setBehavior('sleep');
    pet.caption = '스르륵…';
    pet.captionT = 0;
  }
  if (needs.hunger < 0.24 && pet.captionT > 4) {
    pet.caption = '밥 생각 중…';
    pet.captionT = 0;
  } else if (needs.energy < 0.16 && pet.captionT > 4) {
    pet.caption = '졸려…';
    pet.captionT = 0;
  }
}
function behaviorWeight(name, base) {
  let w = base.w;
  if (name === 'sleep') w *= needs.energy < 0.3 ? 5 : needs.energy < 0.6 ? 2 : 1;
  if (name === 'plop') w *= needs.energy < 0.4 ? 2.2 : 1;
  if (name === 'zoomies' || name === 'wiggle') w *= needs.energy < 0.35 ? 0.15 : 1;
  if (name === 'sniff') w *= needs.hunger < 0.5 ? 2.2 : 1;
  return w;
}
function setBehavior(name) {
  pet.behavior = name;
  const b = BEHAVIORS[name];
  pet.behaviorT = rand(b.dur[0], b.dur[1]);
  const caps = CAPTIONS[name];
  pet.caption = caps[Math.floor(Math.random() * caps.length)];
  pet.captionT = 0;
  if (name === 'wander' || name === 'zoomies') pickTarget();
  if (name === 'plop') pet.squashVel -= 3.5;
}
function pickTarget() {
  pet.target.x = rand(90, W - 90);
  pet.target.y = rand(H * 0.42, H * 0.82);
}
function nextBehavior() {
  if (food && needs.hunger < 0.98) return setBehavior('eat');
  if (needs.energy < 0.16) return setBehavior('sleep');
  const entries = Object.entries(BEHAVIORS).filter(([n]) => n !== pet.behavior && n !== 'eat');
  let total = entries.reduce((s, [n, b]) => s + behaviorWeight(n, b), 0);
  let roll = Math.random() * total;
  for (const [name, b] of entries) { roll -= behaviorWeight(name, b); if (roll <= 0) return setBehavior(name); }
  setBehavior('stare');
}

// ---------- 상호작용 ----------
function petHitTest(x, y, scale = 1.7) {
  const s = depthScale();
  return dist(x, y, pet.x, pet.y + pet.jy - pet.r * s) < pet.r * s * scale;
}

function isTouchPointer(e) { return e.pointerType === 'touch' || e.pointerType === 'pen'; }
function isTouchType(type) { return type === 'touch' || type === 'pen'; }
function dragThreshold(e) { return isTouchPointer(e) ? 18 : 12; }
function rubThreshold(e) { return isTouchPointer(e) ? 7 : 4; }

function surprisePet() {
  if (input.tapCooldown > 0) return;
  input.tapCooldown = 0.16;
  if (pet.jy > -4) pet.jvy = -240;
  else pet.jvy = Math.max(pet.jvy, -80);
  pet.squashVel = clamp(pet.squashVel - 4, -10, 10);
  pet.dizzy = Math.min(pet.dizzy + 1, 3);
  affectNeed('energy', -0.012);
  pet.caption = pet.dizzy >= 3 ? '@_@ 그만…' : '깜짝!?';
  pet.captionT = 0;
  if (pet.behavior === 'sleep' || pet.behavior === 'plop') setTimeout(() => setBehavior('stare'), 0);
  pet.behaviorT = Math.max(pet.behaviorT, 1.2);
  for (let i = 0; i < 4; i++) spawn('dust', pet.x + rand(-20, 20), pet.y);
}

function startDrag(e) {
  if (input.mode === 'drag') return;
  input.mode = 'drag';
  const liftForFinger = isTouchPointer(e) ? 28 : 8;
  input.dragOffsetX = pet.x - e.clientX;
  input.dragOffsetY = pet.y + pet.jy - e.clientY - liftForFinger;
  input.dragTalkT = rand(0.6, 1.2);
  pet.jvy = 0;
  pet.vx = 0;
  pet.vy = 0;
  pet.tripT = 0;
  pet.behavior = 'stare';
  pet.behaviorT = Math.max(pet.behaviorT, 1.5);
  pet.caption = randomLine(PICKUP_LINES);
  pet.captionT = 0;
  pet.landCaption = '';
  pet.landingT = 0;
  reanchorFeetToBody(1);
}

function updateDrag(dt) {
  const s = depthScale();
  const targetX = clamp(input.x + input.dragOffsetX, 70, W - 70);
  const minAirGap = isTouchType(input.pointerType) ? 62 : 46;
  const airGap = isTouchType(input.pointerType) ? 96 : 72;
  let targetVisualGroundY = clamp(input.y + input.dragOffsetY, H * 0.16, H * 0.78);
  const targetGroundY = clamp(targetVisualGroundY + airGap, H * 0.4, H * 0.85);
  targetVisualGroundY = Math.min(targetVisualGroundY, targetGroundY - minAirGap);
  const prevX = pet.x, prevY = pet.y;
  const t = 1 - Math.exp(-22 * dt);
  pet.x = lerp(pet.x, targetX, t);
  pet.y = lerp(pet.y, targetGroundY, t);
  pet.jy = lerp(pet.jy, targetVisualGroundY - pet.y, 1 - Math.exp(-26 * dt));
  pet.vx = clamp((pet.x - prevX) / Math.max(dt, 0.001), -420, 420);
  pet.vy = clamp((pet.y - prevY) / Math.max(dt, 0.001), -420, 420);
  pet.dir = pet.vx < -6 ? -1 : pet.vx > 6 ? 1 : pet.dir;
  pet.squashVel = clamp(pet.squashVel + Math.sin(pet.wobblePhase * 6) * 0.04 * s, -8, 8);
  input.dragTalkT -= dt;
  if (input.dragTalkT <= 0 && pet.captionT > 0.7) {
    pet.caption = randomLine(CARRY_LINES);
    pet.captionT = 0;
    input.dragTalkT = rand(0.9, 1.8);
  }
}

function bounceReact({ lines, strength, x, y }) {
  if (pet.captionT > 0.14) {
    pet.caption = randomLine(lines);
    pet.captionT = 0;
  }
  pet.landingT = Math.max(pet.landingT, clamp(strength / 1200, 0.22, 0.65));
  affectNeed('energy', -clamp(strength / 18000, 0.006, 0.06));
  pet.squashVel = clamp(pet.squashVel - clamp(strength / 180, 1.5, 7.5), -12, 12);
  const count = clamp(Math.floor(strength / 180), 2, 7);
  for (let i = 0; i < count; i++) spawn('dust', x + rand(-14, 14), y + rand(-4, 6));
}

function finishPointer(e) {
  if (!input.active || input.pointerId !== e.pointerId) return;
  const elapsed = performance.now() - input.downAt;
  const moved = dist(input.startX, input.startY, e.clientX, e.clientY);
  const wasDrag = input.mode === 'drag';
  const wasPetting = input.mode === 'pet';
  if (wasDrag) {
    const releaseAge = performance.now() - (input.lastMoveAt || input.downAt);
    const fresh = clamp(1 - releaseAge / 320, 0, 1);
    const throwVX = input.releaseVX * fresh;
    const throwVY = input.releaseVY * fresh;
    pet.vx = clamp(throwVX * 0.92, -1100, 1100);
    pet.vy = 0;
    pet.jy = Math.min(pet.jy, -44);
    pet.jvy = clamp(throwVY * 0.9 + 60, -1050, 1120);
    pet.squashVel = clamp(pet.squashVel - 2.4, -8, 8);
    pet.caption = randomLine(DROP_LINES);
    pet.captionT = 0;
    affectNeed('energy', -0.025);
    pet.landCaption = randomLine(LAND_LINES);
    pet.behavior = 'stare';
    pet.behaviorT = Math.max(pet.behaviorT, 2.2);
  } else if (!wasPetting && elapsed < 260 && moved < rubThreshold(e) * 1.4 && petHitTest(e.clientX, e.clientY, 1.8)) {
    surprisePet();
  }
  input.active = false;
  input.pointerId = null;
  input.pointerType = '';
  input.mode = 'idle';
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
}

cv.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (!petHitTest(e.clientX, e.clientY, 1.85)) return;
  input.active = true;
  input.pointerId = e.pointerId;
  input.pointerType = e.pointerType;
  input.mode = 'pending';
  input.startX = e.clientX; input.startY = e.clientY;
  input.x = e.clientX; input.y = e.clientY;
  input.px = e.clientX; input.py = e.clientY;
  input.downAt = performance.now();
  input.lastMoveAt = e.timeStamp || input.downAt;
  input.releaseVX = 0; input.releaseVY = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});

cv.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (!input.active || input.pointerId !== e.pointerId) return;
  const elapsed = performance.now() - input.downAt;
  const fromStart = dist(input.startX, input.startY, e.clientX, e.clientY);
  const frameMove = dist(input.x, input.y, e.clientX, e.clientY);
  input.releaseVX = (e.clientX - input.x) / Math.max((e.timeStamp || performance.now()) - (input.lastMoveAt || input.downAt), 16) * 1000;
  input.releaseVY = (e.clientY - input.y) / Math.max((e.timeStamp || performance.now()) - (input.lastMoveAt || input.downAt), 16) * 1000;
  input.px = input.x; input.py = input.y;
  input.x = e.clientX; input.y = e.clientY;
  input.lastMoveAt = e.timeStamp || performance.now();

  if (input.mode === 'pending' && (fromStart > dragThreshold(e) || (elapsed > 180 && fromStart > rubThreshold(e)))) startDrag(e);
  else if (input.mode === 'pending' && frameMove > rubThreshold(e)) input.mode = 'pet';
  else if (input.mode === 'pet' && fromStart > dragThreshold(e) * 1.45 && elapsed > 120) startDrag(e);
  e.preventDefault();
});

cv.addEventListener('pointerup', finishPointer);
cv.addEventListener('pointercancel', finishPointer);

function updatePetting(dt) {
  const s = depthScale();
  if (input.mode === 'drag') {
    mouse.px = mouse.x; mouse.py = mouse.y;
    return;
  }
  const over = Math.hypot(mouse.x - pet.x, mouse.y - (pet.y + pet.jy - pet.r * s)) < pet.r * s * 1.5;
  const moved = Math.hypot(mouse.x - mouse.px, mouse.y - mouse.py);
  if (over && moved > 2 && pet.behavior !== 'zoomies') {
    pet.happy = clamp(pet.happy + moved * 0.004, 0, 1);
    affectNeed('energy', moved * 0.000025);
    if (pet.happy > 0.5 && Math.random() < dt * 3) spawn('heart', pet.x + rand(-24, 24), pet.y - pet.r * s * 1.6);
    if (pet.happy > 0.5 && pet.captionT > 1) { pet.caption = '기분좋아…'; pet.captionT = 0; }
  }
  pet.happy = Math.max(0, pet.happy - dt * 0.12);
  pet.dizzy = Math.max(0, pet.dizzy - dt * 0.5);
  mouse.px = mouse.x; mouse.py = mouse.y;
}

// ---------- 메인 업데이트 ----------
function update(dt) {
  input.tapCooldown = Math.max(0, input.tapCooldown - dt);
  const dragging = input.mode === 'drag';
  const airborne = !dragging && (Math.abs(pet.jy) > 0.01 || Math.abs(pet.jvy) > 0.01);

  if (!dragging) pet.behaviorT -= dt;
  pet.captionT += dt;
  if (!dragging && pet.behaviorT <= 0) nextBehavior();

  // 이동
  let desiredVX = 0, desiredVY = 0;
  if (!dragging && !airborne && pet.behavior === 'eat' && pet.tripT <= 0) {
    if (!food) setBehavior('stare');
    else {
      const dx = food.x - pet.x, dy = food.y - pet.y, d = Math.hypot(dx, dy);
      if (d > 34) {
        desiredVX = dx / d * 150;
        desiredVY = dy / d * 150;
        pet.munchT = 0;
      } else {
        pet.munchT += dt;
        if (pet.munchT % 0.4 < dt) {
          pet.squashVel = clamp(pet.squashVel - 1.6, -12, 12);
          spawn('dust', food.x + rand(-10, 10), food.y - 10);
        }
        if (pet.munchT > 2.4) {
          affectNeed('hunger', 0.45);
          affectNeed('energy', 0.04);
          food = null;
          for (let i = 0; i < 3; i++) spawn('heart', pet.x + rand(-20, 20), pet.y - pet.r);
          setBehavior('stare');
          pet.caption = '잘 먹었습니다';
          pet.captionT = 0;
        }
      }
    }
  }
  const moving = !dragging && !airborne && (pet.behavior === 'wander' || pet.behavior === 'zoomies' || pet.behavior === 'sniff');
  if (moving && pet.tripT <= 0) {
    const speed = pet.behavior === 'zoomies' ? 260 : pet.behavior === 'sniff' ? 26 : 62;
    const dx = pet.target.x - pet.x, dy = pet.target.y - pet.y;
    const d = Math.hypot(dx, dy);
    if (d > 14) { desiredVX = dx / d * speed; desiredVY = dy / d * speed; }
    else if (pet.behavior === 'zoomies') pickTarget();
    else if (pet.behavior === 'wander' && Math.random() < dt * 0.4) pickTarget();
  }
  if (dragging) {
    updateDrag(dt);
  } else if (airborne) {
    pet.vx *= Math.exp(-0.45 * dt);
    pet.vy = 0;
    pet.x += pet.vx * dt;
  } else {
    pet.vx = lerp(pet.vx, desiredVX, 1 - Math.exp(-8 * dt));
    pet.vy = lerp(pet.vy, desiredVY, 1 - Math.exp(-8 * dt));
    pet.x += pet.vx * dt; pet.y += pet.vy * dt;
  }
  pet.y = clamp(pet.y, H * 0.4, H * 0.85);
  if (airborne) {
    const sideLimit = pet.r * depthScale() * 1.05;
    if (pet.x < sideLimit) {
      pet.x = sideLimit;
      pet.vx = Math.abs(pet.vx) * 0.84;
      bounceReact({ lines: BOUNCE_LINES, strength: Math.abs(pet.vx), x: pet.x, y: pet.y + pet.jy });
    } else if (pet.x > W - sideLimit) {
      pet.x = W - sideLimit;
      pet.vx = -Math.abs(pet.vx) * 0.84;
      bounceReact({ lines: BOUNCE_LINES, strength: Math.abs(pet.vx), x: pet.x, y: pet.y + pet.jy });
    }
  } else {
    pet.x = clamp(pet.x, 80, W - 80);
  }
  if (Math.abs(pet.vx) > 6) pet.dir = Math.sign(pet.vx);

  // 가끔 자빠짐 (하찮음의 핵심)
  const sp = Math.hypot(pet.vx, pet.vy);
  if (!dragging && pet.jy === 0 && sp > 40 && pet.tripT <= 0 && Math.random() < dt * (pet.behavior === 'zoomies' ? 0.35 : 0.07)) {
    pet.tripT = 0.9;
    pet.squashVel -= 5;
    pet.vx *= 0.15; pet.vy *= 0.15;
    pet.caption = '아이쿠;;'; pet.captionT = 0;
    for (let i = 0; i < 5; i++) spawn('dust', pet.x + rand(-24, 24), pet.y);
  }
  pet.tripT = Math.max(0, pet.tripT - dt);

  // 말랑 스프링 (부피 보존: 세로로 찌부되면 가로로 퍼짐)
  const stiff = 110, damp = 7.5;
  pet.squashVel += (1 - pet.squash) * stiff * dt - pet.squashVel * damp * dt;
  pet.squashVel = clamp(pet.squashVel, -12, 12);
  pet.squash = clamp(pet.squash + pet.squashVel * dt, 0.42, 1.5);

  // 점프
  if (!dragging && (pet.jvy !== 0 || pet.jy !== 0)) {
    pet.jvy += 900 * dt; pet.jy += pet.jvy * dt;
    const s = depthScale();
    const top = pet.y + pet.jy - pet.r * s;
    const topLimit = topBounceLimit();
    if (top < topLimit && pet.jvy < 0) {
      pet.jy = topLimit + pet.r * s - pet.y;
      pet.jvy = Math.abs(pet.jvy) * 0.72;
      bounceReact({ lines: BOUNCE_LINES, strength: Math.abs(pet.jvy), x: pet.x, y: pet.y + pet.jy - pet.r * s });
    }
    if (pet.jy >= 0) {
      const impact = pet.jvy;
      pet.jy = 0;
      const shouldBounce = impact > 170 || Math.abs(pet.vx) > 260;
      if (shouldBounce) {
        const bounce = clamp(0.58 + Math.min(Math.abs(pet.vx) / 1100, 1) * 0.18, 0.58, 0.76);
        pet.jvy = -Math.max(95, impact * bounce);
        pet.vx *= 0.86;
        bounceReact({ lines: BOUNCE_LINES, strength: impact + Math.abs(pet.vx) * 0.35, x: pet.x, y: pet.y });
      } else {
        pet.jvy = 0;
        pet.vx *= 0.55;
        pet.squashVel -= 3;
        if (pet.landCaption) {
          pet.caption = pet.landCaption;
          pet.captionT = 0;
          pet.landCaption = '';
        }
        pet.landingT = 1.05;
        pet.behaviorT = Math.max(pet.behaviorT, 1.35);
        for (let i = 0; i < 3; i++) spawn('dust', pet.x + rand(-18, 18), pet.y);
      }
      if (Math.abs(pet.jvy) < 115 && Math.abs(pet.vx) < 160) {
        pet.jvy = 0;
        pet.vx *= 0.45;
        if (pet.landCaption) {
          pet.caption = pet.landCaption;
          pet.landCaption = '';
        }
        pet.captionT = 0;
        pet.landingT = 1.05;
        pet.behaviorT = Math.max(pet.behaviorT, 1.35);
      }
    }
  } else if (dragging) {
    pet.jvy = 0;
  }

  // 걷기 리듬 & 잔출렁임
  pet.walkPhase += sp * dt * 0.09;
  pet.wobblePhase += dt * (2.2 + sp * 0.02);
  updateCare(dt, { airborne, speed: sp });

  // 시선: 커서가 가까우면 커서를, 아니면 허공을 본다
  const md = Math.hypot(mouse.x - pet.x, mouse.y - pet.y);
  let gx, gy;
  if (md < 300 && pet.behavior !== 'sleep') {
    gx = clamp((mouse.x - pet.x) / 200, -1, 1); gy = clamp((mouse.y - pet.y + 60) / 200, -1, 1);
  } else {
    gx = Math.sin(pet.wobblePhase * 0.23) * 0.6; gy = Math.cos(pet.wobblePhase * 0.31) * 0.3;
  }
  pet.gazeX = lerp(pet.gazeX, gx, 1 - Math.exp(-5 * dt));
  pet.gazeY = lerp(pet.gazeY, gy, 1 - Math.exp(-5 * dt));

  // 눈 깜빡임
  pet.nextBlink -= dt;
  if (pet.nextBlink <= 0) { pet.blink = 0.14; pet.nextBlink = rand(1.5, 4.5); }
  pet.blink = Math.max(0, pet.blink - dt);
  pet.landingT = Math.max(0, pet.landingT - dt);

  // 귀 움찔
  pet.nextTwitch -= dt;
  if (pet.nextTwitch <= 0) {
    pet.earTwitch = { side: Math.random() < 0.5 ? -1 : 1, t: 0 };
    pet.nextTwitch = rand(2.5, 7);
  }
  pet.earTwitch.t += dt;

  // 잠: Zzz
  if (pet.behavior === 'sleep') {
    pet.zTimer -= dt;
    if (pet.zTimer <= 0) { spawn('z', pet.x + 30 * depthScale(), pet.y - pet.r * 1.6 * depthScale()); pet.zTimer = 1.3; }
  }

  updateFeet(dt);
  const ts = depthScale(), tr = pet.r * ts;
  const tailBob = Math.abs(Math.sin(pet.walkPhase)) * -4 * (sp > 10 ? 1 : 0);
  // 기분 좋으면 살랑살랑 흔들림
  const wag = Math.sin(pet.wobblePhase * 5) * (120 + pet.happy * 1600);
  updateChain(tail, pet.x - pet.dir * tr * 0.8, pet.y + pet.jy + tailBob - tr * 0.6, dt, 520, wag);
  updateParticles(dt);
  updatePetting(dt);
}

// ---------- 그리기 ----------
const BODY = '#efd9b8', BODY_DARK = '#dfc49c', OUTLINE = 'rgba(96,74,56,0.35)';

function drawBlob(cx, cy, rx, ry) {
  const n = pet.lumps.length;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    const lump = pet.lumps[i] + Math.sin(a * 3 + pet.wobblePhase) * 1.6;
    pts.push({ x: cx + Math.cos(a) * (rx + lump), y: cy + Math.sin(a) * (ry + lump) });
  }
  // 꼭짓점 사이 중점을 지나는 곡선 → 각지지 않는 말랑한 윤곽
  ctx.beginPath();
  ctx.moveTo((pts[0].x + pts[n - 1].x) / 2, (pts[0].y + pts[n - 1].y) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
  }
  ctx.closePath();
}

// 고양이 귀 — 몸통 로컬 좌표계에서 그려서 찌부/숨쉬기를 같이 탄다
// phase 'outer': 몸통보다 먼저 (베이스가 몸에 묻힘), 'inner': 몸통 뒤에 속귀만
function drawEars(r, phase) {
  const tw = pet.earTwitch;
  const heldOrFalling = input.mode === 'drag' || pet.jy < -8;
  for (const side of [-1, 1]) {
    let twitch = 0;
    if (tw.side === side && tw.t < 0.4) twitch = Math.sin(tw.t * 28) * 0.25 * (1 - tw.t / 0.4);
    ctx.save();
    ctx.translate(side * r * 0.52, -r * 0.66 + (heldOrFalling ? r * 0.06 : 0));
    ctx.rotate(side * (heldOrFalling ? 0.43 : 0.3) + twitch * (heldOrFalling ? 0.35 : 1));
    if (phase === 'outer') {
      ctx.beginPath();
      ctx.moveTo(-r * 0.27, 0);
      ctx.quadraticCurveTo(-r * 0.2, -r * 0.44, 0, -r * 0.56);
      ctx.quadraticCurveTo(r * 0.2, -r * 0.44, r * 0.27, 0);
      ctx.closePath();
      ctx.fillStyle = BODY; ctx.fill();
      ctx.strokeStyle = OUTLINE; ctx.lineWidth = outlineWidth(r); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-r * 0.13, -r * 0.12);
      ctx.quadraticCurveTo(-r * 0.09, -r * 0.34, 0, -r * 0.42);
      ctx.quadraticCurveTo(r * 0.09, -r * 0.34, r * 0.13, -r * 0.12);
      ctx.closePath();
      ctx.fillStyle = 'rgba(232,160,150,0.5)'; ctx.fill();
    }
    ctx.restore();
  }
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);
  // 바닥 힌트
  ctx.fillStyle = '#ece5d3';
  ctx.fillRect(0, H * 0.38, W, H);

  const s = depthScale(), r = pet.r * s;
  const sy = pet.squash, sx = 1 + (1 - sy) * 0.85;
  const sp = Math.hypot(pet.vx, pet.vy);
  const bob = Math.abs(Math.sin(pet.walkPhase)) * -4 * (sp > 10 ? 1 : 0);
  const breathe = (pet.behavior === 'sleep' ? Math.sin(t * 1.6) * 0.035 : Math.sin(t * 2.6) * 0.015);
  const cy = pet.y + pet.jy + bob - r * sy;

  // 그림자
  ctx.fillStyle = 'rgba(120,100,70,0.18)';
  ctx.beginPath();
  ctx.ellipse(pet.x, pet.y + 4, r * 1.15 * sx * (1 - pet.jy * -0.002), r * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();

  // 밥그릇
  if (food) {
    const fs = 0.75 + (food.y / H) * 0.45;
    ctx.fillStyle = 'rgba(115,95,70,0.18)';
    ctx.beginPath(); ctx.ellipse(food.x, food.y + 2, 16 * fs, 5 * fs, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f0c98b';
    ctx.beginPath(); ctx.ellipse(food.x, food.y - 5 * fs, 14 * fs, 9 * fs, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d59b57';
    ctx.beginPath(); ctx.ellipse(food.x, food.y - 8 * fs, 11 * fs, 5 * fs, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8c6042';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(food.x + Math.cos(i * 1.9) * 6 * fs, food.y - 8 * fs + Math.sin(i * 2.4) * 2 * fs, 2.6 * fs, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 꼬리 (몸 뒤)
  drawTail(tail, 8);

  // 다리 (뭉툭한 캡슐)
  ctx.strokeStyle = BODY_DARK; ctx.lineWidth = 9 * s; ctx.lineCap = 'round';
  for (const f of feet) {
    ctx.beginPath();
    ctx.moveTo(pet.x + f.ox * r * 0.8, cy + r * 0.5 * sy);
    ctx.lineTo(f.x, f.y);
    ctx.stroke();
  }
  // 발끝
  ctx.fillStyle = BODY_DARK;
  for (const f of feet) { ctx.beginPath(); ctx.arc(f.x, f.y, 5.5 * s, 0, Math.PI * 2); ctx.fill(); }

  // 몸통 (머리 겸용 한 덩어리)
  ctx.save();
  ctx.translate(pet.x, cy);
  if (pet.behavior === 'wiggle') ctx.rotate(Math.sin(t * 14) * 0.13);
  if (pet.tripT > 0) ctx.rotate(pet.dir * pet.tripT * 0.35);
  ctx.scale(sx + breathe, sy - breathe);
  drawEars(r, 'outer');
  drawBlob(0, 0, r * 1.05, r);
  ctx.fillStyle = BODY; ctx.fill();
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = outlineWidth(r); ctx.stroke();
  // 배 무늬
  ctx.beginPath(); ctx.ellipse(0, r * 0.45, r * 0.55, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,250,240,0.55)'; ctx.fill();
  drawEars(r, 'inner');
  ctx.restore();

  // 얼굴
  const sniffing = pet.behavior === 'sniff';
  const headDip = sniffing ? r * 0.35 + Math.sin(t * 9) * 2 : 0;
  const fx = pet.x + pet.dir * r * 0.22 * sx;
  const fy = cy - r * 0.25 * sy + headDip;
  const eyeGap = r * 0.3 * sx;
  const gx = pet.gazeX * 3.2, gy = pet.gazeY * 2.4;
  const sleeping = pet.behavior === 'sleep';
  const held = input.mode === 'drag';
  const falling = pet.jy < -8 && pet.landCaption;
  const justLanded = pet.landingT > 0;
  const closed = sleeping || pet.blink > 0 || (pet.behavior === 'plop' && pet.squash < 0.7);
  const happyEyes = pet.happy > 0.5;

  ctx.strokeStyle = '#4a3a2c'; ctx.fillStyle = '#4a3a2c'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  // 눈 두 개 — 일부러 크기가 다름 (하찮음 포인트)
  const eyes = [{ ox: -eyeGap, r: 3.6 * s, oy: 0 }, { ox: eyeGap, r: 2.9 * s, oy: -1.5 * s }];
  for (const e of eyes) {
    const ex = fx + e.ox + gx;
    const ey = fy + e.oy + gy;
    if (held || justLanded) {
      const pinch = e.ox < 0 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(ex - 4.2 * pinch * s, ey - 2.6 * s);
      ctx.lineTo(ex, ey + 0.8 * s);
      ctx.lineTo(ex - 4.2 * pinch * s, ey + 4.2 * s);
      ctx.stroke();
    } else if (falling) {
      const eyeLift = 0.8 * s;
      ctx.beginPath();
      ctx.ellipse(ex, ey + eyeLift, e.r * 1.25, e.r * 1.55, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (closed) {
      ctx.beginPath();
      ctx.moveTo(ex - 3.5, ey);
      ctx.lineTo(ex + 3.5, ey);
      ctx.stroke();
    } else if (happyEyes) {
      ctx.beginPath();
      ctx.arc(ex, ey + 2, 4 * s, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(ex, ey, e.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // 어지러움 소용돌이
  if (pet.dizzy >= 3) {
    ctx.save(); ctx.strokeStyle = '#8a7a68'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(fx, fy - r * 0.8, 6, t * 6, t * 6 + 4.6); ctx.stroke();
    ctx.restore();
  }
  // 입: 항상 같은 ω 모양을 유지한다
  const my = fy + r * 0.28 * sy + gy * 0.5;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(fx + gx * 0.7 - 2.4 * s, my, 2.4 * s, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.arc(fx + gx * 0.7 + 2.4 * s, my, 2.4 * s, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  ctx.lineWidth = 2;
  // 볼터치
  if (pet.happy > 0.25) {
    ctx.fillStyle = `rgba(240,140,130,${pet.happy * 0.5})`;
    ctx.beginPath(); ctx.arc(fx - eyeGap * 1.7, fy + r * 0.2, 5 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(fx + eyeGap * 1.7, fy + r * 0.2, 5 * s, 0, Math.PI * 2); ctx.fill();
  }

  // 파티클
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    if (p.type === 'heart') {
      ctx.fillStyle = `rgba(235,110,120,${a})`;
      ctx.font = `${11 + a * 4}px sans-serif`;
      ctx.fillText('♥', p.x, p.y);
    } else if (p.type === 'z') {
      ctx.fillStyle = `rgba(140,125,105,${a})`;
      ctx.font = `${10 + (1 - a) * 8}px sans-serif`;
      ctx.fillText('z', p.x + (1 - a) * 14, p.y - (1 - a) * 20);
    } else {
      ctx.fillStyle = `rgba(170,150,120,${a * 0.6})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3 * a, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 캡션 (혼잣말)
  const capAlpha = clamp(1.4 - pet.captionT * 0.25, 0, 1);
  if (capAlpha > 0) {
    ctx.fillStyle = `rgba(130,115,95,${capAlpha})`;
    ctx.font = '13px -apple-system, "Apple SD Gothic Neo", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(pet.caption, pet.x, pet.y + 34);
    ctx.textAlign = 'left';
  }
}

window.__petDebug = {
  snapshot() {
    const s = depthScale(), r = pet.r * s;
    const anchors = feet.map(f => footBodyTarget(f));
    return {
      viewport: { width: W, height: H },
      pet: {
        x: pet.x, y: pet.y, jy: pet.jy,
        vx: pet.vx, vy: pet.vy, jvy: pet.jvy,
        squash: pet.squash,
        behavior: pet.behavior,
        caption: pet.caption,
        landingT: pet.landingT,
        needs: { ...needs },
        food: food ? { ...food } : null,
      },
      visualTop: pet.y + pet.jy - r,
      topBounceLimit: topBounceLimit(),
      input: { active: input.active, mode: input.mode },
      feet: feet.map((f, i) => ({
        x: f.x,
        y: f.y,
        anchorX: anchors[i].x,
        anchorY: anchors[i].y,
        distance: dist(f.x, f.y, anchors[i].x, anchors[i].y),
      })),
      maxFootDistance: Math.max(...feet.map((f, i) => dist(f.x, f.y, anchors[i].x, anchors[i].y))),
      radius: r,
    };
  },
};

// ---------- 하단 UI ----------
const gH = document.getElementById('gH'), gE = document.getElementById('gE');
document.getElementById('feedBtn').addEventListener('click', () => {
  if (food) return;
  food = {
    x: clamp(pet.x + rand(-170, 170), 90, W - 90),
    y: clamp(pet.y + rand(-70, 70), H * 0.45, H * 0.82),
  };
  if (input.mode !== 'drag') setBehavior('eat');
});
function updateGauges() {
  gH.style.width = needs.hunger * 100 + '%';
  gH.style.background = needs.hunger < 0.3 ? '#d9776b' : '#a8c686';
  gE.style.width = needs.energy * 100 + '%';
  gE.style.background = needs.energy < 0.3 ? '#d9776b' : '#8fb7d9';
}

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw(now / 1000);
  updateGauges();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
