<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%23efd9b8'/%3E%3Ccircle cx='24' cy='30' r='3' fill='%234a3a2c'/%3E%3Ccircle cx='40' cy='30' r='3' fill='%234a3a2c'/%3E%3C/svg%3E">
<title>하찮은 펫 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div id="bondBadge" aria-label="유대 단계">
  <div id="rankLine">유대 · 초면</div>
</div>
<div id="topSign" aria-label="조작 안내">
  <div id="hint">탭 놀래키기 · 문지르기 쓰담 · 길게 잡기</div>
</div>
<button id="debugAdultBtn" type="button" aria-label="디버그: 성체로 성장">성체</button>
<button id="memoryBtn" aria-expanded="false" aria-controls="memoryPanel">기억</button>
<div id="topMenu" aria-label="주요 메뉴">
  <button id="outingBtn" aria-expanded="false" aria-controls="outingSheet">외출</button>
  <button id="moreBtn" aria-expanded="false" aria-controls="moreSheet">기록</button>
</div>
<canvas id="c"></canvas>
<div id="furnitureRemoveZone" aria-hidden="true">치우기</div>
<div id="ui">
  <div id="memoryLine">오늘 아직 아무 일 없음</div>
  <div id="gauges">
    <div class="g">밥<div class="bar"><i id="gH"></i></div></div>
    <div class="g">기운<div class="bar"><i id="gE"></i></div></div>
    <div class="g">마음<div class="bar"><i id="gB"></i></div></div>
  </div>
  <div id="actions">
    <button id="feedBtn">밥주기</button>
    <button id="restBtn">재우기</button>
    <button id="playBtn">공놀이</button>
    <button id="returnBtn" class="is-context">귀가</button>
  </div>
</div>
<div id="sheetScrim" class="overlay-scrim" hidden></div>
<div id="outingSheet" class="bottom-sheet" hidden>
  <button id="walkBtn">산책</button>
  <button id="battleBtn">전투</button>
  <button id="shopBtn">상점</button>
</div>
<div id="moreSheet" class="bottom-sheet" hidden>
  <button id="memorySheetBtn">기억</button>
  <button id="notebookBtn">수첩</button>
</div>
<div id="battleScrim" class="overlay-scrim" hidden></div>
<section id="battlePanel" class="battle-panel" aria-label="전투" hidden>
  <button id="battleCloseBtn" class="battle-close" aria-label="닫기">닫기</button>
  <div class="battle-content">
    <h2>전투</h2>
    <p id="battleLeagueName"></p>
    <div id="battleOpponentCard" class="battle-opponent-card"></div>
    <button id="battleChallengeBtn" class="battle-challenge">도전</button>
    <section id="battleRematchSection">
      <h3>다시 만난 애들</h3>
      <div id="battleRematchList" class="battle-rematch-list"></div>
    </section>
  </div>
</section>
<div id="notebookScrim" class="overlay-scrim" hidden></div>
<section id="notebookPanel" class="notebook-panel" aria-label="수첩" hidden>
  <button id="notebookCloseBtn" class="notebook-close" aria-label="닫기">닫기</button>
  <div class="notebook-content">
    <h2>수첩</h2>
    <p id="notebookTogether"></p>
    <section>
      <h3>자람</h3>
      <p id="notebookStage"></p>
    </section>
    <section>
      <h3>유대</h3>
      <p id="notebookKinship"></p>
    </section>
    <section id="notebookTraitsSection">
      <h3>성격</h3>
      <ul id="notebookTraits"></ul>
    </section>
    <section>
      <h3>반짝</h3>
      <p id="notebookPebbles"></p>
    </section>
    <section>
      <h3>몸</h3>
      <div id="notebookBodyStats"></div>
    </section>
  </div>
</section>
<div id="memoryScrim" class="overlay-scrim" hidden></div>
<section id="memoryPanel" class="memory-panel" aria-label="기억" hidden>
  <button id="memoryCloseBtn" class="memory-close" aria-label="닫기">닫기</button>
  <div class="memory-content">
    <h2>기억</h2>
    <div id="memoryGroups" class="memory-groups"></div>
  </div>
</section>
<div id="shopScrim" class="overlay-scrim" hidden></div>
<section id="shopPanel" class="shop-panel" aria-label="상점" hidden>
  <button id="shopCloseBtn" class="shop-close" aria-label="닫기">닫기</button>
  <div class="shop-content">
    <h2>상점</h2>
    <p id="shopBalance" class="shop-balance"></p>
    <div id="shopList" class="shop-list"></div>
  </div>
</section>
<script src="./src/render.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js" defer></script>
<script src="./src/battle-core.js" defer></script>
<script src="./src/app.js" defer></script>
<script src="./src/care.js" defer></script>
<script src="./src/input.js" defer></script>
<script src="./src/sim.js" defer></script>
<script src="./src/boot.js" defer></script>
</body>
</html>
